name: CI Pipeline

# Solo en pull requests (y a mano): la regla de main exige la rama al día, así que el PR ya
# probó el mismo código que queda al unir. Correrlo otra vez en el push a main no aporta nada.
on:
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android NDK and CMake (whisper.cpp)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.15729638" "cmake;3.22.1" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint check
        run: ./gradlew ktlintCheck

  unit:
    name: Unit & Feature Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android NDK and CMake (whisper.cpp)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.15729638" "cmake;3.22.1" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run test suite
        run: ./gradlew :core:domain:jvmTest :core:data-memory:jvmTest :core:data-local:jvmTest :composeApp:testDebugUnitTest

  build:
    name: Build Artifacts Check
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # Gradle configura también :composeApp, que declara el NDK de whisper.cpp: sin esto falla por licencias.
      - name: Install Android NDK and CMake (whisper.cpp)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.15729638" "cmake;3.22.1" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Solo los módulos core: la app de depuración la compila el job "Android APK" y la release
      # (R8 + whisper.cpp nativo, lenta) la arma release.yml con cada etiqueta vX.Y.Z.
      - name: Build core modules
        run: ./gradlew :core:domain:assemble :core:data-memory:assemble :core:data-local:assemble

  android:
    name: Android APK
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android NDK and CMake (whisper.cpp)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.15729638" "cmake;3.22.1" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coinden-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
