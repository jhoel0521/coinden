name: Versión para Google Play

# Al publicar una etiqueta vX.Y.Z arma el AAB firmado con la llave de subida y lo deja para
# descargar y subir a Play Console. La llave y sus contraseñas vienen de los secretos del
# repositorio; nunca están en el código.
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: read

# Nunca se cancela una versión a medias: una etiqueta nueva espera a la anterior.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bundle:
    name: AAB firmado
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Una versión para Play solo sale de código que ya pasó por main (y por su CI).
      - name: Verificar que la etiqueta está en main
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "La etiqueta $GITHUB_REF_NAME no está en main: no se publica." >&2
            exit 1
          }

      - uses: ./.github/actions/preparar-android

      - name: Versión desde la etiqueta
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if ! echo "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then name="0.1.0"; fi
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # 1.2.3 -> 10203: siempre crece con la versión.
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Llave de subida desde los secretos
        env:
          KEYSTORE_BASE64: ${{ secrets.COINDEN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secreto COINDEN_KEYSTORE_BASE64: no se puede firmar para Play." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "COINDEN_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB
        env:
          COINDEN_KEYSTORE_PASSWORD: ${{ secrets.COINDEN_KEYSTORE_PASSWORD }}
          COINDEN_KEY_ALIAS: ${{ secrets.COINDEN_KEY_ALIAS }}
          COINDEN_KEY_PASSWORD: ${{ secrets.COINDEN_KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: coinden-${{ steps.version.outputs.name }}-aab
          path: composeApp/build/outputs/bundle/release/*.aab
          retention-days: 30
