schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  Escribe todos los artefactos (proposal, specs, design, tasks) en español.
  Respeta MANIFIESTO.md: ningún artefacto puede contradecir sus principios del producto.
  Local-first y cero servidores de CoinDen: sin backend propio, cuenta obligatoria, telemetría ni APIs de IA remotas; los datos solo viajan entre dispositivos del usuario (sync P2P) o a su propia nube (respaldo futuro), cifrados y por decisión explícita.
  Sync-ready desde el día 1: IDs UUID, movimientos append-only y correcciones como nuevos eventos; ningún diseño puede asumir un único dispositivo.
  Inteligencia determinista: parsing, categorización y cálculos son reglas puras y testeables en core/domain; voz y OCR son adaptadores on-device detrás de puertos.
  Tasas reales: las operaciones de cambio guardan su propia tasa; la tasa configurada solo sirve para valorar el patrimonio.
  Categoría (en qué) y medio de pago (de qué billetera) son ejes distintos.
  Capturar ≠ confirmar: los borradores no afectan saldos hasta que el usuario los confirma.
  Montos como enteros en unidades mínimas; nunca Double para dinero.
  Cada escenario WHEN/THEN debe poder probarse; las pruebas de feature usan las personas John, Carlos, Facundo, Sophie y Wei.
  Cada proposal declara explícitamente qué queda fuera de alcance (Non-Goals).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
